name: Check changes
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/showle_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      SENTRY_AUTH_TOKEN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: showle_security
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: showle_security_fix
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U showle_security -d showle_security_fix"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local_ci_only
      DATABASE_URL: postgresql://showle_security:local_ci_only@127.0.0.1:55439/showle_migration_test
      SHOWLE_SECURITY_PG_TEST: "1"
      SHOWLE_SECURITY_PSQL: /usr/bin/psql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - name: Create isolated migration database
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55439 -U showle_security -d showle_security_fix -c 'CREATE DATABASE showle_migration_test'
      - name: Replay the full migration chain from empty
        run: npx prisma migrate deploy
      - name: Require no schema drift after migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Check real PostgreSQL concurrency and ownership
        run: npx vitest run src/lib/__tests__/postgres-security.integration.test.ts src/lib/__tests__/shared-rate-limit.integration.test.ts
